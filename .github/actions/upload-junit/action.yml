name: Upload JUnit Report
description: Upload the Vitest JUnit reports of the current job, read by the flaky test tracker Routine

runs:
  using: composite
  steps:
    # The attempt suffix keeps each re-run's report.
    - name: Upload JUnit report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: junit-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: packages/*/test-results/junit.xml
        if-no-files-found: ignore
        retention-days: 14
