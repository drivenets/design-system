name: Security

on:
  pull_request:
    branches: ['main', 'next']

  schedule:
    - cron: '0 0 * * 6'

permissions: {}

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  CodeQL:
    name: CodeQL (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'GitHub Actions'
            language: actions

          - label: 'TypeScript'
            language: javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{matrix.language}}'

  Zizmor:
    name: Zizmor (GitHub Actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: informational
