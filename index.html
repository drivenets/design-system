<style>#ds-storybook-chunk-reload-notice {
	position: fixed;
	inset: 0;
	z-index: 2147483647;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: var(--md, 20px);
	box-sizing: border-box;
	padding: var(--2xl, 48px);
	background: var(--color-dap-gray-050, #ffffff);
	color: var(--color-dap-brand-500, #001a47);
	font-family: var(--font-family-base, Roboto), sans-serif;
	font-size: var(--body-font-size-md, 16px);
	line-height: var(--body-line-height-md, 24px);
	text-align: center;
}

#ds-storybook-chunk-reload-notice .ds-storybook-chunk-reload-notice__spinner {
	inline-size: 40px;
	block-size: 40px;
	border-radius: 50%;
	border: 4px solid var(--color-dap-brand-050, #e5e8ed);
	border-top-color: var(--color-dap-brand-500, #001a47);
	animation: ds-storybook-chunk-reload-spin 0.8s linear infinite;
}

#ds-storybook-chunk-reload-notice .ds-storybook-chunk-reload-notice__message {
	margin: 0;
	max-inline-size: 34ch;
	font-weight: var(--font-weight-medium, 500);
}

@keyframes ds-storybook-chunk-reload-spin {
	to {
		transform: rotate(360deg);
	}
}

@media (prefers-reduced-motion: reduce) {
	#ds-storybook-chunk-reload-notice .ds-storybook-chunk-reload-notice__spinner {
		animation-duration: 2s;
	}
}
</style>
<template id="ds-storybook-chunk-reload-notice-template"><div id="ds-storybook-chunk-reload-notice" role="status" aria-live="polite">

	<p class="ds-storybook-chunk-reload-notice__message">
		A new version of the story documentation is available. Reloading…
	</p>
</div>
</template>
